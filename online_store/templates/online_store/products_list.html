{% extends 'online_store/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>
    {% if products %}
        <ul class="list-group">
            {% for product in products %}
            <li class="list-group-item">
                <h5><a href="{% url 'product_detail' product.id %}">{{ product.name }}</a></h5>
                <p>{{ product.price }} ₽</p>
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <div>
            <p>Товары отсутствуют</p>
        </div>
    {% endif %}
{% endblock %}
